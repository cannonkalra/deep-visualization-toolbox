[project]
name = "deep-visualization-toolbox"
version = "2.0.0"
description = "Deep Visualization Toolbox, running on PyTorch via a Caffe-compatible shim (torchcaffe)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    # OpenCV 5 changed the built-in fonts the UI is laid out for, and dropped cv2.dnn.readNetFromCaffe (used by tests)
    "opencv-python>=4.10,<5",
    "torch>=2.4",
    # torchcaffe/proto/caffe_pb2.py was generated by protoc 7.35; the runtime must be at least that
    "protobuf>=7.35,<8",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
